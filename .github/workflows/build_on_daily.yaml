name: "Daily: Build + SonarQube Full Scan"

on:
  schedule:
    - cron: '0 2 * * *'

jobs:
  test-and-sonar:
    name: Build, Test & SonarQube Full Analysis
    runs-on: ubuntu-latest
    if: github.repository == 'wl4g/rengine'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compile (skip tests)
        run: |
          ./mvnw clean install -T 4C \
            -Dmaven.test.skip=true \
            -DskipTests \
            -DskipITs \
            -Djacoco.skip=true \
            -Dgpg.skip \
            -B
        env:
          MAVEN_OPTS: "-Xmx2g -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

      - name: Test common with JaCoCo
        run: |
          ./mvnw verify -pl common \
            -Djacoco.skip=false \
            -Dgpg.skip \
            -B \
            -DfailIfNoTests=false
        env:
          MAVEN_OPTS: "-Xmx2g -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

      - name: Set up SonarScanner CLI
        run: |
          set -eo pipefail
          SONAR_SCANNER_VERSION=5.0.1.3006
          SCANNER_HOME="/tmp/sonar-scanner-${SONAR_SCANNER_VERSION}-linux"
          if [ ! -f "${SCANNER_HOME}/bin/sonar-scanner" ]; then
            curl -sSL --retry 3 --retry-delay 5 \
              -o /tmp/sonar-scanner.zip \
              "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip"
            unzip -qo /tmp/sonar-scanner.zip -d /tmp
          fi
          "${SCANNER_HOME}/bin/sonar-scanner" --version
          echo "${SCANNER_HOME}/bin" >> "$GITHUB_PATH"

      - name: SonarQube Scan
        run: |
          sonar-scanner \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}"
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
