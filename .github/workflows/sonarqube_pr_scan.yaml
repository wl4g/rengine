name: "PR: Test + SonarQube Incremental Scan"

on:
  pull_request:
    branches: ['**']

jobs:
  test-and-sonar:
    name: Test & SonarQube PR Analysis
    runs-on: ubuntu-latest
    if: github.repository == 'wl4g/rengine'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build & Test with JaCoCo
        run: |
          ./tools/build/run.sh build-maven \
            -DskipTests=false \
            -Djacoco.skip=false
        env:
          MAVEN_OPTS: "-Xmx2g -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

      - name: Set up SonarScanner CLI
        run: |
          set -eo pipefail
          SONAR_SCANNER_VERSION=5.0.1.3006
          SCANNER_HOME="/tmp/sonar-scanner-${SONAR_SCANNER_VERSION}"
          if [ ! -f "${SCANNER_HOME}/bin/sonar-scanner" ]; then
            curl -sSL --retry 3 --retry-delay 5 \
              -o /tmp/sonar-scanner.zip \
              "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip"
            unzip -qo /tmp/sonar-scanner.zip -d /tmp
          fi
          "${SCANNER_HOME}/bin/sonar-scanner" --version
          echo "${SCANNER_HOME}/bin" >> "$GITHUB_PATH"

      - name: SonarQube Scan (Scanner CLI)
        run: |
          sonar-scanner \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
