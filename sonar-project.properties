# SonarQube Project Configuration for Rengine
sonar.projectKey=rengine
sonar.projectName=Rengine
sonar.projectVersion=1.0.0

# Source directories (only modules that compiled successfully)
sonar.sources=common/src/main/java,apiserver/src/main/java,controller/src/main/java,service/src/main/java

# Java bytecode paths for analysis (must match existing target/classes)
sonar.java.binaries=common/target/classes,apiserver/target/classes,controller/target/classes,service/target/classes

# Test source directories
sonar.tests=common/src/test/java,apiserver/src/test/java,controller/src/test/java,service/src/test/java

# Coverage Reports
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/test/**,**/*.test.*,**/node_modules/**,**/*.min.js,**/*.min.css,**/.git/**,**/target/**,**/docs/**,**/*.md,**/example/**,**/rengine-operator/**,**/rengine-ui/**,**/run.sh,**/*.xml,**/*.yml,**/*.yaml,**/*.properties,**/*.sql,**/*.sh,**/*.cmd

# Language & Encoding
sonar.language=java
sonar.sourceEncoding=UTF-8
sonar.java.source=11
